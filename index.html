<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>درب الثراء</title>
<style>
:root{
  --bg:#f3f0e8;--card:#fffdf8;--ink:#1d2730;--muted:#66717d;--line:#e4ded0;
  --brand:#0f766e;--brand-2:#14b8a6;--brand-ink:#fff;--gold:#c8901a;
  --good:#15803d;--bad:#b91c1c;--soft:#efeadd;--shadow:0 2px 10px rgba(30,40,50,.08);
  --t-payday:#c9f3d6;--t-deal:#cfe2fb;--t-doodad:#fcd3d3;--t-market:#fbe7a4;
  --t-child:#f9d2e6;--t-charity:#e1daf9;--t-layoff:#dcdfe3;--t-dream:#fddcb8;--t-lawsuit:#fcd3d3;--t-tax:#e6e8eb;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12171c;--card:#1b232b;--ink:#e8edf2;--muted:#98a4b0;--line:#2b3641;--soft:#222c35;--brand:#2dd4bf;--brand-2:#0f766e;--brand-ink:#06201d;--gold:#f0b43c;--shadow:none;
  --t-payday:#17482b;--t-deal:#1d3a60;--t-doodad:#5a2020;--t-market:#5a4710;--t-child:#582044;--t-charity:#3a2f68;--t-layoff:#38414a;--t-dream:#693a12;--t-lawsuit:#5a2020;--t-tax:#343b43}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;line-height:1.55;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:1.5rem;box-shadow:var(--shadow);flex:none}
header h1{font-size:1.3rem;margin:0;line-height:1.2}
header p{margin:0;color:var(--muted);font-size:.8rem}
.hbtn{margin-inline-start:auto;background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:1.2rem;padding:0;box-shadow:var(--shadow)}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--soft);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.stat small{color:var(--muted);font-size:.74rem;display:flex;gap:4px;align-items:center}
.stat b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}
.prog{margin-top:10px}
.prog-top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:5px;gap:8px}
.bar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));width:0;border-radius:8px;transition:width .5s}
.phase{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.phase.fast{background:var(--gold);color:#241800}
.board{display:grid;gap:4px;direction:ltr;width:100%}
.tile{aspect-ratio:1;min-width:0;overflow:visible;word-break:break-word;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.56rem;text-align:center;position:relative;color:#16202a;line-height:1.15;padding:2px;border:1px solid rgba(0,0,0,.06);transition:transform .15s}
@media(prefers-color-scheme:dark){.tile{color:#eef2f6;border-color:rgba(255,255,255,.07)}}
.tile .ic{font-size:1.05rem}
.tile.me{outline:3px solid var(--brand);outline-offset:1px;transform:scale(1.07);z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.token{position:absolute;top:-9px;inset-inline-end:-5px;font-size:1.25rem;filter:drop-shadow(0 1px 2px rgba(0,0,0,.4))}
.center{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;gap:6px;direction:rtl}
.center .big{font-size:1rem;font-weight:700}
.center .mut{color:var(--muted);font-size:.8rem}
.dice{font-size:3.6rem;line-height:1;color:var(--brand);user-select:none}
.dice.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.06)}100%{transform:rotate(-8deg)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px;font-size:.72rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.1)}
.log{max-height:190px;overflow:auto;font-size:.88rem}
.log h3{margin:0 0 6px;font-size:.9rem}
.log p{margin:0;padding:6px 0;border-bottom:1px dashed var(--line)}
.log p:first-of-type{font-weight:700}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--brand);color:var(--brand-ink);font-weight:700;min-height:46px;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}
button.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.bar-actions{position:fixed;inset-inline:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:16px 14px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar-actions .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
#roll{flex:1;font-size:1.1rem;box-shadow:0 4px 14px rgba(15,118,110,.35)}
.modal{position:fixed;inset:0;background:rgba(8,14,20,.55);display:none;align-items:flex-end;justify-content:center;padding:0;z-index:9}
@media(min-width:560px){.modal{align-items:center;padding:16px}}
.modal.on{display:flex}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:480px;width:100%;max-height:90vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:560px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 8px;font-size:1.2rem}
.sheet h3{margin:14px 0 4px;font-size:1rem}
.sheet p{margin:6px 0}
.sheet table{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0}
.sheet td{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top}
.sheet td:last-child{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .row button{flex:1;min-width:110px}
.sub{color:var(--muted);font-size:.85rem}
.prof{display:block;width:100%;text-align:start;margin-bottom:8px;background:var(--soft);color:var(--ink);border:1px solid var(--line);font-weight:700}
.prof small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.tabs{display:flex;gap:6px;overflow:auto;margin:6px -2px 10px;padding:2px}
.tabs button{flex:none;min-height:38px;padding:7px 13px;font-size:.88rem;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tip{background:var(--soft);border-inline-start:4px solid var(--brand);border-radius:10px;padding:8px 10px;margin:10px 0;font-size:.9rem}
.tip.warn{border-color:var(--gold)}
dl{margin:6px 0}dt{font-weight:700;margin-top:10px}dd{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:700;color:#16202a}
.toast{position:fixed;top:12px;inset-inline:14px;margin:0 auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.9rem;z-index:20;opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:none}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🏁</div>
    <div><h1>درب الثراء</h1><p>من سباق الفئران إلى الحرية المالية</p></div>
    <button class="hbtn" id="helpBtn" aria-label="كيف ألعب؟">؟</button>
  </header>

  <div class="card">
    <div class="stats" id="stats"></div>
    <div class="prog">
      <div class="prog-top"><span id="phase"></span><span id="progtxt"></span></div>
      <div class="bar" role="progressbar" aria-label="تقدم الخروج من سباق الفئران"><i id="prog"></i></div>
    </div>
  </div>

  <div class="card">
    <div class="board" id="board"></div>
    <div class="legend" id="legend"></div>
  </div>

  <div class="card log"><h3>📜 سجل الأحداث</h3><div id="log"></div></div>
</div>

<div class="bar-actions"><div class="in">
  <button id="roll">🎲 ارمِ النرد</button>
  <button class="alt" id="sheetBtn" aria-label="قائمتي المالية">📋 قائمتي</button>
  <button class="alt" id="newBtn" aria-label="لعبة جديدة">🔄</button>
</div></div>

<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString("en-US");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const sleep=ms=>new Promise(r=>setTimeout(r,ms));
const KEY="darb-althara-v1", SEEN="darb-althara-help";
const FACES=["⚀","⚁","⚂","⚃","⚄","⚅"];

/* ---------- المحتوى ---------- */
const PROFS=[
 {n:"معلّم",e:"📚",salary:4200,tax:620,home:520,car:140,cards:90,other:260,childCost:150,cash:3000,debt:"قرض سكن 72,000"},
 {n:"ممرّض",e:"🩺",salary:5100,tax:810,home:640,car:180,cards:110,other:300,childCost:170,cash:3500,debt:"قرض سكن 88,000"},
 {n:"مهندس",e:"📐",salary:7800,tax:1500,home:1250,car:290,cards:220,other:480,childCost:260,cash:5200,debt:"قرض سكن 150,000"},
 {n:"سائق",e:"🚚",salary:3300,tax:430,home:410,car:110,cards:60,other:210,childCost:120,cash:2200,debt:"قرض سكن 54,000"},
 {n:"طبيب",e:"⚕️",salary:12500,tax:2900,home:2300,car:480,cards:400,other:900,childCost:420,cash:9000,debt:"قرض سكن 310,000"},
 {n:"محاسب",e:"🧮",salary:5600,tax:930,home:720,car:190,cards:130,other:330,childCost:180,cash:4000,debt:"قرض سكن 96,000"}
];
const RAT=["payday","deal","doodad","deal","market","charity","deal","doodad","payday","deal","market","deal","doodad","child","deal","payday","market","deal","doodad","deal","layoff","market","deal","charity"];
const FAST=["payday","biz","dream","biz","lawsuit","biz","payday","dream","biz","tax","biz","dream"];
const DREAMS=[
 {n:"رحلة حول العالم مع العائلة",cost:180000},
 {n:"مدرسة خيرية باسمك",cost:320000},
 {n:"منزل الأحلام على الشاطئ",cost:450000}
];
const TILE={
 payday:["💰","يوم الراتب","--t-payday"],deal:["🤝","فرصة","--t-deal"],doodad:["🛍️","مصروف طارئ","--t-doodad"],
 market:["📈","السوق","--t-market"],child:["👶","مولود","--t-child"],charity:["🎁","تبرّع","--t-charity"],
 layoff:["📉","تسريح","--t-layoff"],biz:["🏢","مشروع كبير","--t-deal"],dream:["⭐","حلم","--t-dream"],
 lawsuit:["⚖️","قضية","--t-lawsuit"],tax:["🧾","ضريبة","--t-tax"]
};
const SMALL=[
 {n:"شقة صغيرة للإيجار",t:"عقار",down:3000,cost:38000,inc:160},
 {n:"كشك قهوة عند محطة",t:"مشروع",down:4000,cost:9000,inc:230},
 {n:"حزمة أسهم شركة نقل",t:"أسهم",down:2500,cost:2500,inc:0},
 {n:"محل هدايا صغير",t:"مشروع",down:4500,cost:12000,inc:260},
 {n:"غرفة مؤجرة للطلاب",t:"عقار",down:2000,cost:22000,inc:110},
 {n:"حزمة أسهم شركة غذاء",t:"أسهم",down:1800,cost:1800,inc:20},
 {n:"عربة وجبات سريعة",t:"مشروع",down:5000,cost:14000,inc:300},
 {n:"مغسلة ملابس بالقطعة",t:"مشروع",down:3500,cost:9500,inc:190}
];
const BIG=[
 {n:"عمارة سكنية ٨ شقق",t:"عقار",down:60000,cost:520000,inc:1850},
 {n:"مغسلة سيارات آلية",t:"مشروع",down:45000,cost:110000,inc:1250},
 {n:"مزرعة دواجن",t:"مشروع",down:80000,cost:190000,inc:2350},
 {n:"مطعم عائلي",t:"مشروع",down:100000,cost:240000,inc:3100},
 {n:"قطعة أرض للتطوير",t:"عقار",down:30000,cost:30000,inc:0},
 {n:"حزمة أسهم شركة طاقة",t:"أسهم",down:35000,cost:35000,inc:450},
 {n:"مجمّع محلات تجارية",t:"عقار",down:90000,cost:620000,inc:2900},
 {n:"مصنع تعبئة صغير",t:"مشروع",down:70000,cost:150000,inc:2100}
];
const BIZ=[
 {n:"سلسلة مقاهٍ من ٦ فروع",t:"مشروع",down:120000,inc:3200},
 {n:"برج مكاتب",t:"عقار",down:200000,inc:5600},
 {n:"شركة برمجيات ناشئة",t:"مشروع",down:90000,inc:2400},
 {n:"مستودعات لوجستية",t:"عقار",down:150000,inc:4100},
 {n:"مصنع أغذية",t:"مشروع",down:180000,inc:5000}
];
const DOODADS=[
 ["إصلاح مفاجئ للسيارة",900],["شاشة تلفاز جديدة",1500],["عشاء فاخر لأصدقاء",400],
 ["هاتف أحدث إصدار",1300],["رحلة قصيرة غير مخططة",2200],["غسالة معطّلة",700],["مخالفة مرورية",350]
];

/* ---------- الحالة ---------- */
let S=null, busy=false;
const blank=()=>({prof:"-",emoji:"🧑",salary:0,cash:0,exp:{},childCost:0,children:0,loans:0,debt:"",assets:[],pos:0,skip:0,charity:0,fast:false,turns:0,last:1,log:[]});

function newGame(pi){
  const p=PROFS[pi];
  S=Object.assign(blank(),{prof:p.n,emoji:p.e,salary:p.salary,cash:p.cash,
     exp:{"ضرائب":p.tax,"قسط السكن":p.home,"قسط السيارة":p.car,"بطاقات ائتمان":p.cards,"مصاريف أخرى":p.other},
     childCost:p.childCost,debt:p.debt});
  log(`بدأت كـ${p.n}. راتبك ${fmt(p.salary)} ومصاريفك ${fmt(expenses())}.`);
  save();render();
  toast("ابدأ برمي النرد 🎲");
}
function expenses(){return Object.values(S.exp).reduce((a,b)=>a+b,0)+S.children*S.childCost+S.loans*0.1}
function passive(){return S.assets.reduce((a,b)=>a+b.inc,0)}
function cashflow(){return S.salary+passive()-expenses()}
function log(t){S.log.unshift(t);S.log=S.log.slice(0,40)}
function save(){try{localStorage.setItem(KEY,JSON.stringify(S))}catch(e){}}
function load(){try{const r=localStorage.getItem(KEY);if(r){S=Object.assign(blank(),JSON.parse(r));return S.prof!=="-"}}catch(e){}return false}
let tt;function toast(t){const el=$("#toast");el.textContent=t;el.classList.add("on");clearTimeout(tt);tt=setTimeout(()=>el.classList.remove("on"),2200)}

/* ---------- العرض ---------- */
function render(){
  const cf=cashflow();
  const cells=[
    ["💵","النقد",fmt(S.cash),S.cash<0?"bad":""],
    ["💼",S.fast?"الراتب (متوقف)":"الراتب",fmt(S.fast?0:S.salary),""],
    ["🌱","الدخل السلبي",fmt(passive()),"good"],
    ["🧾","المصاريف",fmt(expenses()),"bad"]
  ];
  $("#stats").innerHTML=cells.map(([i,k,v,c])=>`<div class="stat"><small>${i} ${k}</small><b class="${c}">${v}</b></div>`).join("");
  const ratio=expenses()?Math.min(1,passive()/expenses()):0;
  $("#prog").style.width=(S.fast?100:ratio*100)+"%";
  $("#phase").innerHTML=S.fast?'<span class="phase fast">المسار السريع 🚀</span>':'<span class="phase">سباق الفئران 🐀</span>';
  $("#progtxt").textContent=S.fast?"اشترِ حلمك لتفوز":`دخل سلبي ${fmt(passive())} من ${fmt(expenses())} · تدفق ${cf>=0?"+":""}${fmt(cf)}`;
  const track=S.fast?FAST:RAT, n=S.fast?4:7;
  const b=$("#board");b.style.gridTemplateColumns=`repeat(${n},minmax(0,1fr))`;
  const cells2=perimeter(n);
  let html="";
  for(let r=0;r<n;r++)for(let c=0;c<n;c++){
    const i=cells2.findIndex(x=>x[0]===r&&x[1]===c);
    if(i<0){
      if(n===7&&r===1&&c===1)html+=`<div class="center" style="grid-column:2/7;grid-row:2/7"><div class="dice" id="dice">${FACES[S.last-1]}</div><div class="big">${S.emoji} ${S.prof}</div><div class="mut">الدور ${S.turns}</div></div>`;
      if(n===4&&r===1&&c===1)html+=`<div class="center" style="grid-column:2/4;grid-row:2/4"><div class="dice" id="dice">${FACES[S.last-1]}</div><div class="big">🚀 المسار السريع</div></div>`;
      continue;
    }
    const [ic,name,col]=TILE[track[i]];
    html+=`<div class="tile ${i===S.pos?"me":""}" style="grid-row:${r+1};grid-column:${c+1};background:var(${col})"><span class="ic">${ic}</span>${name}${i===S.pos?`<span class="token">${S.emoji}</span>`:""}</div>`;
  }
  b.innerHTML=html;
  $("#log").innerHTML=S.log.map(t=>`<p>${t}</p>`).join("");
  $("#roll").disabled=busy;
  const used=[...new Set(track)];
  $("#legend").innerHTML=used.map(k=>`<span><i style="background:var(${TILE[k][2]})"></i>${TILE[k][1]}</span>`).join("");
}
function perimeter(n){
  const a=[];
  for(let c=0;c<n;c++)a.push([0,c]);
  for(let r=1;r<n;r++)a.push([r,n-1]);
  for(let c=n-2;c>=0;c--)a.push([n-1,c]);
  for(let r=n-2;r>=1;r--)a.push([r,0]);
  return a;
}

/* ---------- النوافذ ---------- */
function modal(title,body,btns){
  $("#sheet").innerHTML=`<h2>${title}</h2>${body}<div class="row"></div>`;
  const row=$("#sheet .row");
  (btns||[]).forEach(([label,fn,alt])=>{
    const b=document.createElement("button");b.textContent=label;if(alt)b.className="alt";
    b.onclick=()=>{close();fn&&fn()};row.appendChild(b);
  });
  $("#modal").classList.add("on");
}
function close(){$("#modal").classList.remove("on")}
function ensureCash(amount,forced,cb){
  if(S.cash>=amount){cb(true);return}
  const need=Math.ceil((amount-S.cash)/1000)*1000;
  const take=()=>{S.cash+=need;S.loans+=need;log(`🏦 اقترضت ${fmt(need)}.`);cb(true)};
  modal("🏦 تحتاج إلى قرض",`<p>ينقصك ${fmt(amount-S.cash)}. البنك يقرضك <b>${fmt(need)}</b> بقسط شهري ${fmt(need*0.1)} (10%) يُضاف إلى مصاريفك.</p>`,
   forced?[["اقترض",take]]:[["اقترض",take],["لا",()=>cb(false),true]]);
}

/* ---------- سير الدور ---------- */
function finish(){
  busy=false;
  if(!S.fast&&passive()>0&&passive()>=expenses()){
    const bonus=passive()*40;
    S.fast=true;S.pos=0;S.cash+=bonus;
    log(`🎉 خرجت من سباق الفئران! مكافأة ${fmt(bonus)}.`);
    save();render();
    modal("🎉 مبروك! خرجت من سباق الفئران",`<p>دخلك السلبي (${fmt(passive())}) صار يغطي مصاريفك. دخلت <b>المسار السريع</b> بنقد ${fmt(S.cash)}.</p><div class="tip">الهدف الآن: اشترِ أحد الأحلام الثلاثة على اللوحة. تستطيع أيضاً توسيع مشاريعك لزيادة نقدك.</div>`,[["هيا 🚀",null]]);
    return;
  }
  save();render();
}
function win(d){
  S.cash-=d.cost;
  log(`🏆 حققت حلمك: ${d.n}!`);
  save();render();
  modal("🏆 فزت!",`<p>حققت حلمك: <b>${d.n}</b>.</p><p>أنهيت اللعبة في <b>${S.turns}</b> دوراً، ودخلك السلبي <b>${fmt(passive())}</b> شهرياً. وصلت للحرية المالية!</p>`,[["لعبة جديدة",()=>chooseProf()]]);
}
function pay(){
  const amt=S.fast?passive()*12:cashflow();
  S.cash+=amt;
  log(`💰 يوم الراتب: ${amt>=0?"+":""}${fmt(amt)}`);
  if(S.cash<0){
    const need=Math.ceil(-S.cash/1000)*1000;
    S.cash+=need;S.loans+=need;
    log(`🏦 رصيدك سالب، فاقترضت ${fmt(need)} تلقائياً.`);
  }
}
async function roll(){
  if(busy)return;busy=true;S.turns++;render();
  if(S.skip>0){S.skip--;log(`⏸️ فاتك الدور (تسريح). متبقٍ ${S.skip}.`);return finish()}
  const dice=S.charity>0&&!S.fast?2:1;
  if(S.charity>0)S.charity--;
  let d=0;const ds=[];for(let i=0;i<dice;i++){const x=1+Math.floor(Math.random()*6);ds.push(x);d+=x}
  const el=$("#dice");
  if(el){el.classList.add("roll");for(let i=0;i<6;i++){el.textContent=rnd(FACES);await sleep(80)}el.classList.remove("roll");el.textContent=FACES[ds[0]-1]}
  S.last=ds[0];
  log(`🎲 رميت ${ds.join(" + ")}${dice>1?" = "+d:""}.`);
  const track=S.fast?FAST:RAT;
  for(let i=0;i<d;i++){
    S.pos=(S.pos+1)%track.length;
    if(track[S.pos]==="payday"&&i<d-1)pay();
    render();await sleep(140);
  }
  await sleep(120);
  resolve(track[S.pos]);
}
function resolve(k){
  if(k==="payday"){pay();return finish()}
  if(k==="doodad"){
    const [n,c]=rnd(DOODADS);
    return modal("🛍️ مصروف طارئ",`<p>${n}: <b class="bad">${fmt(c)}</b></p><p class="sub">مصاريف الاستهلاك لا تُنتج دخلاً. هي جزء من الحياة، لكن لا تدعها تلتهم نقدك.</p>`,[["ادفع",()=>ensureCash(c,true,()=>{S.cash-=c;log(`🛍️ دفعت ${fmt(c)} على «${n}».`);finish()})]]);
  }
  if(k==="child"){
    S.children++;log(`👶 رزقت بمولود. مصاريفك +${fmt(S.childCost)}.`);
    return modal("👶 مولود جديد",`<p>مبروك! تزيد مصاريفك ${fmt(S.childCost)} شهرياً.</p><p class="sub">ارتفاع المصاريف يعني أنك تحتاج دخلاً سلبياً أكبر للخروج.</p>`,[["حسناً",finish]]);
  }
  if(k==="layoff"){
    const c=expenses();
    return modal("📉 تسريح مؤقت",`<p>فقدت وظيفتك مؤقتاً. ادفع مصاريف شهر (<b class="bad">${fmt(c)}</b>) وتفوتك دورتان.</p><p class="sub">دخلك السلبي يستمر بالوصول حتى وأنت بلا وظيفة، وهذا سبب بنائه.</p>`,[["ادفع",()=>ensureCash(c,true,()=>{S.cash-=c;S.skip=2;log(`📉 تسريح: دفعت ${fmt(c)} وتفوتك دورتان.`);finish()})]]);
  }
  if(k==="charity"){
    const c=Math.round((S.salary+passive())*0.1);
    return modal("🎁 فرصة تبرّع",`<p>تبرّع بـ <b>${fmt(c)}</b> (10% من دخلك) فترمي نردين لمدة ٣ أدوار.</p>`,
      [["تبرّع",()=>{if(S.cash<c){log("لا يكفي النقد للتبرع.");return finish()}S.cash-=c;S.charity=3;log(`🎁 تبرعت بـ ${fmt(c)} — نردان لـ٣ أدوار.`);finish()}],["تجاوز",finish,true]]);
  }
  if(k==="market")return market();
  if(k==="deal")return modal("🤝 فرصة استثمارية",`<p>اختر حجم الصفقة:</p><div class="tip">الصغيرة أرخص وأخف مخاطرة. الكبيرة تحتاج نقداً أكبر لكن دخلها أعلى.</div>`,[["صفقة صغيرة",()=>offer(rnd(SMALL))],["صفقة كبيرة",()=>offer(rnd(BIG))]]);
  if(k==="biz")return offer(rnd(BIZ));
  if(k==="dream"){
    const d=DREAMS[FAST.slice(0,S.pos).filter(x=>x==="dream").length];
    return modal(`⭐ ${d.n}`,`<p>السعر: <b>${fmt(d.cost)}</b> — نقدك ${fmt(S.cash)}.</p>`,
      S.cash>=d.cost?[["حقّق الحلم",()=>win(d)],["لاحقاً",finish,true]]:[["لا يكفي النقد",finish,true]]);
  }
  if(k==="lawsuit"){const c=Math.round(S.cash*0.2);return modal("⚖️ قضية",`<p>تدفع ${fmt(c)} (20% من نقدك).</p>`,[["ادفع",()=>{S.cash-=c;log(`⚖️ قضية: دفعت ${fmt(c)}.`);finish()}]])}
  if(k==="tax"){const c=Math.round(S.cash*0.1);return modal("🧾 ضريبة",`<p>تدفع ${fmt(c)} (10% من نقدك).</p>`,[["ادفع",()=>{S.cash-=c;log(`🧾 ضريبة: ${fmt(c)}.`);finish()}]])}
  finish();
}
function offer(c){
  const inc=c.inc?`الدخل الشهري الصافي: <b class="good">+${fmt(c.inc)}</b>`:"لا دخل شهرياً — الربح من إعادة البيع.";
  modal(`${c.n}`,`<p>النوع: ${c.t}${c.cost?` — القيمة: ${fmt(c.cost)}`:""}<br>الدفعة الأولى: <b>${fmt(c.down)}</b><br>${inc}</p><p class="sub">نقدك: ${fmt(S.cash)}</p>`,
   [["اشترِ",()=>ensureCash(c.down,false,ok=>{
      if(!ok)return finish();
      S.cash-=c.down;S.assets.push({n:c.n,t:c.t,inc:c.inc,cost:c.cost||c.down});log(`✅ اشتريت «${c.n}» بدفعة ${fmt(c.down)}.`);finish();
    })],["تجاوز",finish,true]]);
}
function market(){
  const owned=S.assets.filter(a=>a.cost);
  if(!owned.length){log("📈 السوق نشط لكنك لا تملك أصولاً للبيع.");return finish()}
  const a=rnd(owned);
  const f=a.t==="أسهم"?0.5+Math.random()*2.2:1.05+Math.random()*0.9;
  const price=Math.round(a.cost*f/100)*100;
  const gain=price-a.cost;
  modal("📈 عرض من السوق",`<p>مشترٍ يعرض <b>${fmt(price)}</b> على «${a.n}» (قيمتها ${fmt(a.cost)}).<br>${gain>=0?"ربح":"خسارة"}: <b class="${gain>=0?"good":"bad"}">${fmt(Math.abs(gain))}</b></p><p class="sub">لو بعت، تخسر دخلها الشهري ${fmt(a.inc)}.</p>`,
    [["بِع",()=>{S.cash+=price;S.assets.splice(S.assets.indexOf(a),1);log(`📈 بعت «${a.n}» بـ ${fmt(price)}.`);finish()}],["احتفظ",finish,true]]);
}

/* ---------- القائمة المالية ---------- */
function sheet(){
  const ex=Object.entries(S.exp).map(([k,v])=>`<tr><td>${k}</td><td>${fmt(v)}</td></tr>`).join("");
  const as=S.assets.length?S.assets.map(a=>`<tr><td>${a.n}<br><span class="sub">${a.t}</span></td><td class="good">${a.inc?"+"+fmt(a.inc):"—"}</td></tr>`).join(""):`<tr><td colspan="2" class="sub">لا أصول بعد. اشترِ أول صفقة!</td></tr>`;
  const btns=[["إغلاق",null,true]];
  if(S.loans>0&&S.cash>=1000)btns.unshift(["سدّ قرضاً 1,000",()=>{S.cash-=1000;S.loans-=1000;log("🏦 سددت 1,000 من القرض.");save();render();sheet()}]);
  modal(`📋 قائمة ${S.prof} المالية`,
   `<table><tr><td>الراتب</td><td>${fmt(S.salary)}</td></tr><tr><td>الدخل السلبي</td><td class="good">${fmt(passive())}</td></tr>
    <tr><td>إجمالي المصاريف</td><td class="bad">${fmt(expenses())}</td></tr><tr><td><b>التدفق الشهري</b></td><td><b>${fmt(cashflow())}</b></td></tr></table>
    <details><summary>المصاريف بالتفصيل</summary><table>${ex}<tr><td>أطفال (${S.children})</td><td>${fmt(S.children*S.childCost)}</td></tr><tr><td>أقساط القروض (${fmt(S.loans)})</td><td>${fmt(S.loans*0.1)}</td></tr></table></details>
    <details open><summary>الأصول (مصادر الدخل السلبي)</summary><table>${as}</table></details><p class="sub">${S.debt} (مدرج ضمن قسط السكن)</p>`,btns);
}

/* ---------- شرح اللعبة ---------- */
const HELP=[
 ["الفكرة",()=>`
  <p>أنت موظف براتب، لكن مصاريفك تلتهمه. اللعبة هي أن تبني <b>دخلاً سلبياً</b> (إيجارات ومشاريع وأسهم) حتى يغطي <b>كل مصاريفك الشهرية</b>. عندها تخرج من «سباق الفئران».</p>
  <div class="tip"><b>الفوز على مرحلتين:</b><br>① <b>سباق الفئران 🐀:</b> ابنِ دخلاً سلبياً أكبر من مصاريفك.<br>② <b>المسار السريع 🚀:</b> اجمع نقداً واشترِ أحد أحلامك الثلاثة.</div>
  <h3>الدور الواحد</h3>
  <p>١) ارمِ النرد 🎲 ← ٢) تتحرك قطعتك ← ٣) تنفّذ الخانة التي وقفت عليها ← ٤) يمر الدور.</p>`],
 ["الخانات",()=>{
  const rows=[
   ["payday","تقبض تدفقك الشهري (الراتب + الدخل السلبي − المصاريف). وتقبضه كذلك عند المرور بالخانة."],
   ["deal","فرصة استثمارية: اختر صفقة صغيرة أو كبيرة. تدفع دفعة أولى وتحصل على دخل شهري."],
   ["biz","(المسار السريع) مشروع كبير بدفعة أولى ضخمة ودخل عالٍ."],
   ["market","مشترٍ يعرض سعراً على أحد أصولك. بِع إن كان الربح يستحق فقدان دخلها."],
   ["doodad","مصروف طارئ لا يعطي دخلاً. تدفعه مباشرة."],
   ["child","مولود جديد: تزيد مصاريفك الشهرية."],
   ["charity","تبرّع بـ10% من دخلك لترمي نردين ٣ أدوار."],
   ["layoff","تسريح: تدفع مصاريف شهر وتفوتك دورتان."],
   ["dream","(المسار السريع) اشترِ حلمك إن كان نقدك يكفي فتفوز."],
   ["lawsuit","قضية تأخذ 20% من نقدك."],
   ["tax","ضريبة تأخذ 10% من نقدك."]];
  return `<dl>${rows.map(([k,t])=>`<dt><span class="chip" style="background:var(${TILE[k][2]})">${TILE[k][0]} ${TILE[k][1]}</span></dt><dd>${t}</dd>`).join("")}</dl>`}],
 ["المصطلحات",()=>`<dl>
  <dt>الراتب</dt><dd>دخلك من وظيفتك. يتوقف أثناء التسريح.</dd>
  <dt>الدخل السلبي</dt><dd>مال يأتيك شهرياً من أصول تملكها (إيجار، مشروع، أرباح) دون أن تعمل ساعة إضافية.</dd>
  <dt>المصاريف</dt><dd>ما تدفعه كل شهر: ضرائب وأقساط ومعيشة وأطفال وقروض.</dd>
  <dt>التدفق النقدي الشهري</dt><dd>الراتب + الدخل السلبي − المصاريف. إن كان موجباً يزيد نقدك مع كل راتب.</dd>
  <dt>الأصل</dt><dd>شيء تشتريه فيدرّ عليك دخلاً (عقار، مشروع، أسهم).</dd>
  <dt>الخصم (الالتزام)</dt><dd>شيء يخرج منك مالاً كل شهر (قرض، قسط، مصروف).</dd>
  <dt>الدفعة الأولى</dt><dd>الجزء الذي تدفعه نقداً من ثمن الصفقة. الباقي يموَّل.</dd>
  <dt>سباق الفئران</dt><dd>حالة من يعمل ليدفع مصاريفه فقط دون أن يبني ثروة.</dd>
  <dt>الحرية المالية</dt><dd>أن يغطي دخلك السلبي مصاريفك كاملة.</dd></dl>`],
 ["نصائح",()=>`
  <div class="tip"><b>١. اشترِ الأصول مبكراً.</b> كل صفقة تزيد دخلك السلبي، وهو سبب الخروج.</div>
  <div class="tip"><b>٢. تجنّب القروض الكثيرة.</b> كل قرض يزيد مصاريفك 10% شهرياً ويبعدك عن الخروج.</div>
  <div class="tip"><b>٣. وازن بين الدخل والمخاطرة.</b> الأسهم قد تضاعف سعرها أو تخسر نصفه، لكن دخلها صغير. العقار والمشاريع أثبت.</div>
  <div class="tip warn"><b>٤. المهن الأعلى دخلاً مصاريفها أعلى.</b> الطبيب يقبض أكثر لكن يحتاج دخلاً سلبياً أكبر ليخرج.</div>
  <div class="tip"><b>٥. لا تبِع كل شيء.</b> عند عرض السوق، سؤال واحد: هل الربح يعوّض دخل الأصل الشهري؟</div>
  <p class="sub">تقدمك يُحفظ تلقائياً على هذا الجهاز. زر 🔄 يبدأ لعبة جديدة.</p>`]
];
function help(tab,after){
  tab=tab||0;
  const draw=()=>{
    $("#sheet").innerHTML=`<h2>❓ كيف ألعب؟</h2><div class="tabs">${HELP.map((h,i)=>`<button class="${i===tab?"on":""}" data-t="${i}">${h[0]}</button>`).join("")}</div><div>${HELP[tab][1]()}</div><div class="row"><button id="hClose">${after?"فهمت، لنبدأ ✅":"إغلاق"}</button></div>`;
    $("#sheet").querySelectorAll(".tabs button").forEach(b=>b.onclick=()=>{tab=+b.dataset.t;draw()});
    $("#hClose").onclick=()=>{close();try{localStorage.setItem(SEEN,"1")}catch(e){}after&&after()};
  };
  draw();$("#modal").classList.add("on");
}

/* ---------- البداية ---------- */
function chooseProf(){
  const b=PROFS.map((p,i)=>`<button class="prof" data-i="${i}">${p.e} ${p.n}<small>راتب ${fmt(p.salary)} · مصاريف ${fmt(p.tax+p.home+p.car+p.cards+p.other)} · نقد ${fmt(p.cash)}</small></button>`).join("");
  $("#sheet").innerHTML=`<h2>اختر مهنتك</h2><p class="sub">المهن الأعلى دخلاً مصاريفها أعلى، فالخروج يحتاج دخلاً سلبياً أكبر.</p>${b}<div class="row"><button class="alt" id="cHelp">❓ كيف ألعب؟</button></div>`;
  $("#sheet").querySelectorAll(".prof").forEach(el=>el.onclick=()=>{close();newGame(+el.dataset.i)});
  $("#cHelp").onclick=()=>help(0,chooseProf);
  $("#modal").classList.add("on");
}
$("#roll").onclick=roll;
$("#sheetBtn").onclick=()=>S&&S.prof!=="-"&&sheet();
$("#helpBtn").onclick=()=>help(0);
$("#newBtn").onclick=()=>{if(S.prof==="-"||confirm("بدء لعبة جديدة؟ سيُمسح التقدم الحالي."))chooseProf()};
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal"&&S&&S.prof!=="-"&&!busy)close()});
if(load())render();
else{S=blank();render();let seen=false;try{seen=localStorage.getItem(SEEN)}catch(e){}seen?chooseProf():help(0,chooseProf)}
})();
</script>
