<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>المدن العشر — الرسم نفسه والمسارات الفعلية</title><style>@font-face{font-family:Tajawal;src:url('../../fonts/Tajawal-Regular.ttf')}*{box-sizing:border-box}body{margin:0;background:#f5f0e6;color:#24424d;font:18px/1.7 Tajawal,sans-serif;padding:24px}h1{margin:0}button,input{font:inherit}button{min-height:48px;border:1px solid #c6c0ae;background:#fffaf0;color:#24424d;border-radius:9px;padding:8px 16px;cursor:pointer}header{max-width:1100px;margin:auto}.tools{display:flex;gap:12px;flex-wrap:wrap;margin:16px 0}main{max-width:1400px;margin:auto;display:grid;grid-template-columns:1fr 1fr;gap:20px}article{min-width:0;background:#fffcf6;border:1px solid #d4cdbb;border-radius:16px;padding:12px}article h2{margin:0;font-size:20px}svg{display:block;width:100%;background:#f7f2e9}output{display:block;min-height:2em;font-size:16px}circle.node{cursor:pointer;stroke:#fff;stroke-width:.5}circle.node:hover,circle.node:focus{stroke:#142d36;stroke-width:2}.guide{pointer-events:none}.moving{stroke:#fff;stroke-width:1.5;pointer-events:none}small{font-size:14px}label{display:flex;align-items:center;gap:6px}@media(max-width:760px){main{grid-template-columns:1fr}body{padding:12px}}</style><header><h1>المدن العشر: الرسومات المعتمدة نفسها</h1><p>نقاط المهام موضوعة على طرق كل رسم. اضغط نقطة لقراءة مهمتها، أو شغّل حركة تجريبية على المسار. هذه معاينة ربط المسارات؛ صور المباراة الفعلية ونتائج الاختبارات في التقرير.</p><div class="tools"><label><input type="checkbox" id="guides">إظهار تتبّع المسارات</label><button id="move">خطوة تجريبية على المدن العشر</button><button id="reset">إعادة القطع للبداية</button><a href="README.md">التقرير والصور</a></div></header><main id="boards"></main><script src="../../scripts/city-scenes.js"></script><script>
(async()=>{const tasks=await(await fetch('tasks.json')).json(),titles=['المعمار','الحكايات','العاج','المرفأ','المدار','الورق','الآفاق','الأحياء','الأنوار','البلور'],ns='http://www.w3.org/2000/svg',pieces=[];let turn=0;function el(tag,attrs){const e=document.createElementNS(ns,tag);for(const[k,v]of Object.entries(attrs))e.setAttribute(k,v);return e;}
for(const d of DarbCityScenes.defs){const article=document.createElement('article'),h=document.createElement('h2');h.textContent=(d.index+1)+' · مدينة '+titles[d.index];article.append(h);const svg=el('svg',{viewBox:d.crop.join(' '),role:'group','aria-label':'الطرق في مدينة '+titles[d.index]});svg.style.aspectRatio='512/'+d.height;svg.append(el('image',{href:'../../art/cities/playable-cities.webp',width:1024,height:1536}));const output=document.createElement('output');for(const track of ['rat','fast']){const points=DarbCityScenes.points(d.id,track),group=el('g',{transform:'translate('+d.crop[0]+' '+d.crop[1]+')'});group.append(el('polyline',{points:[...points,points[0]].map(p=>p.join(',')).join(' '),fill:'none',stroke:track==='rat'?'#176e92':'#c64a76','stroke-width':1,class:'guide',style:'display:none'}));points.forEach((p,i)=>{const node=el('circle',{cx:p[0],cy:p[1],r:2.2,fill:track==='rat'?'#176e92':'#c64a76',class:'node',tabindex:0,role:'button','aria-label':tasks[d.id][track][i].title+' '+(i+1)});const inspect=()=>output.textContent=(track==='rat'?'سباق الفئران':'المسار السريع')+' · الخانة '+(i+1)+' · '+tasks[d.id][track][i].title;node.onclick=inspect;node.onkeydown=e=>{if(e.key==='Enter'||e.key===' '){e.preventDefault();inspect();}};group.append(node);});const token=el('circle',{cx:points[0][0],cy:points[0][1],r:4.5,fill:track==='rat'?'#e17b26':'#315f70',class:'moving'});group.append(token);pieces.push({token,points});svg.append(group);}article.append(svg,output);document.getElementById('boards').append(article);}
document.getElementById('guides').onchange=e=>document.querySelectorAll('.guide').forEach(g=>g.style.display=e.target.checked?'':'none');function move(){for(const{token,points}of pieces){const p=points[turn%points.length];token.setAttribute('cx',p[0]);token.setAttribute('cy',p[1]);}}document.getElementById('move').onclick=()=>{turn++;move();};document.getElementById('reset').onclick=()=>{turn=0;move();};})();
</script></html>
