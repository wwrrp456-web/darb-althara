<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0f766e">
<title>درب الثراء</title>
<style>
:root{
  --bg:#f3f0e8;--card:#fffdf8;--ink:#1d2730;--muted:#66717d;--line:#e4ded0;
  --brand:#0f766e;--brand-2:#14b8a6;--brand-ink:#fff;--gold:#c8901a;
  --good:#15803d;--bad:#b91c1c;--soft:#efeadd;--shadow:0 2px 10px rgba(30,40,50,.08);
  --t-payday:#c9f3d6;--t-deal:#cfe2fb;--t-doodad:#fcd3d3;--t-market:#fbe7a4;
  --t-order:#f0e0c0;--t-souk:#cdeee8;--t-quiz:#d3eef2;--t-auction:#fde2c8;--t-partner:#d9ecd0;--t-family:#ffdfd2;
  --t-child:#f9d2e6;--t-charity:#e1daf9;--t-layoff:#dcdfe3;--t-dream:#fddcb8;--t-lawsuit:#fcd3d3;--t-tax:#e6e8eb;
}
@media (prefers-color-scheme:dark){
  :root{--bg:#12171c;--card:#1b232b;--ink:#e8edf2;--muted:#98a4b0;--line:#2b3641;--soft:#222c35;--brand:#2dd4bf;--brand-2:#0f766e;--brand-ink:#06201d;--gold:#f0b43c;--shadow:none;
  --t-order:#4d3f22;--t-souk:#17483f;--t-quiz:#164650;--t-auction:#6a3b12;--t-partner:#29481f;--t-family:#5a2b1f;
  --t-payday:#17482b;--t-deal:#1d3a60;--t-doodad:#5a2020;--t-market:#5a4710;--t-child:#582044;--t-charity:#3a2f68;--t-layoff:#38414a;--t-dream:#693a12;--t-lawsuit:#5a2020;--t-tax:#343b43}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Segoe UI",Tahoma,system-ui,-apple-system,sans-serif;line-height:1.55;padding:0 14px calc(92px + env(safe-area-inset-bottom))}
.wrap{max-width:720px;margin:0 auto}
body.ingame header{padding:6px 0 4px}body.ingame header p{display:none}body.ingame .logo,body.ingame .hbtn{width:36px;height:36px;font-size:1.15rem}body.ingame header h1{font-size:1.1rem}
.tabs{position:sticky;top:0;z-index:20;display:flex;gap:6px;padding:6px 0 8px;background:var(--bg)}
.tabs button{flex:1 1 0;min-width:0;white-space:nowrap;padding:9px 0;font-size:.76rem;border-radius:12px;background:var(--card);color:var(--ink);border:1px solid var(--line);box-shadow:none;min-height:0}
.tabs button.on{background:var(--brand);color:#fff;border-color:var(--brand)}
.pane{display:none}.pane.on{display:block}
@media(max-height:760px){.legend{display:none}.chip-p .mb{display:none}.chips{padding-bottom:6px}.mini{margin-bottom:6px;padding:5px 10px}.card{padding:8px;margin-bottom:8px}.status:empty{display:none}}
.mini{width:100%;display:flex;justify-content:space-between;align-items:center;gap:6px;margin:0 0 10px;padding:8px 12px;border-radius:14px;background:var(--card);border:1px solid var(--line);color:var(--ink);font-size:.8rem;box-shadow:var(--shadow);min-height:0;font-weight:500}
.mini b{font-size:.92rem}.mini .bad{color:var(--bad,#c0392b)}.mini .good{color:var(--good,#1b8a4a)}
header{display:flex;align-items:center;gap:10px;padding:14px 0 10px}
.logo{width:44px;height:44px;border-radius:13px;background:linear-gradient(135deg,var(--brand),var(--brand-2));display:grid;place-items:center;font-size:1.5rem;box-shadow:var(--shadow);flex:none}
header h1{font-size:1.3rem;margin:0;line-height:1.2}
header p{margin:0;color:var(--muted);font-size:.8rem}
.hbtn{background:var(--card);border:1px solid var(--line);color:var(--ink);border-radius:12px;width:44px;height:44px;font-size:1.2rem;padding:0;box-shadow:var(--shadow);flex:none}
header .sp{margin-inline-start:auto;display:flex;gap:8px}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:12px;margin-bottom:12px;box-shadow:var(--shadow)}
.chips{display:flex;gap:8px;overflow-x:auto;padding:2px 2px 10px;margin:0 -2px}
.chip-p{flex:1 1 0;min-width:82px;max-width:200px;padding:6px 8px!important;background:var(--card);border:2px solid var(--line);border-radius:14px;padding:7px 10px;text-align:start;color:var(--ink);font-weight:600;min-height:0;box-shadow:var(--shadow)}
.chip-p.cur{border-color:var(--pc,var(--brand));box-shadow:0 0 0 3px color-mix(in srgb,var(--pc,var(--brand)) 22%,transparent)}
.chip-p.view{background:var(--soft)}
.chip-p .nm{display:flex;align-items:center;gap:4px;font-size:.82rem;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.chip-p .av{display:inline-grid;place-items:center;width:22px;height:22px;flex:none;border-radius:50%;border:2px solid var(--pc,var(--brand));background:var(--card);font-size:.85rem;flex:none}
.chip-p .mn{font-size:.7rem;color:var(--muted);font-weight:400;margin-top:2px;display:flex;justify-content:space-between;gap:6px}
.chip-p .mb{height:5px;border-radius:4px;background:var(--line);margin-top:4px;overflow:hidden}
.chip-p .mb i{display:block;height:100%;background:var(--pc,var(--brand));width:0}
.status{min-height:0;font-size:.85rem;color:var(--muted);text-align:center;margin:-2px 0 8px}
.stats{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
@media(min-width:520px){.stats{grid-template-columns:repeat(4,1fr)}}
.stat{background:var(--soft);border-radius:12px;padding:9px 11px;display:flex;flex-direction:column;gap:2px}
.stat small{color:var(--muted);font-size:.74rem;display:flex;gap:4px;align-items:center}
.stat b{font-size:1.1rem;font-variant-numeric:tabular-nums}
.good{color:var(--good)}.bad{color:var(--bad)}
.clock{display:flex;justify-content:space-between;flex-wrap:wrap;gap:4px 10px;margin-top:10px;font-size:.82rem;background:var(--soft);border-radius:10px;padding:7px 10px}
.clock b{font-variant-numeric:tabular-nums}
.prog{margin-top:10px}
.prog-top{display:flex;justify-content:space-between;font-size:.82rem;color:var(--muted);margin-bottom:5px;gap:8px}
.bar{height:12px;background:var(--soft);border-radius:8px;overflow:hidden;position:relative}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,var(--brand),var(--brand-2));width:0;border-radius:8px;transition:width .5s}
.phase{display:inline-block;font-size:.72rem;font-weight:700;padding:2px 9px;border-radius:99px;background:var(--soft);color:var(--ink)}
.phase.fast{background:var(--gold);color:#241800}
.board{display:grid;gap:4px;direction:ltr;width:100%}
.tile{aspect-ratio:1;min-width:0;overflow:visible;word-break:break-word;border-radius:10px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:.56rem;text-align:center;position:relative;color:#16202a;line-height:1.15;padding:2px;border:1px solid rgba(0,0,0,.06);transition:transform .15s}
@media(prefers-color-scheme:dark){.tile{color:#eef2f6;border-color:rgba(255,255,255,.07)}}
.tile .ic{font-size:1.05rem}
.tile.me{outline:3px solid var(--brand);outline-offset:1px;transform:scale(1.07);z-index:2;box-shadow:0 4px 12px rgba(0,0,0,.25)}
.tks{position:absolute;top:-10px;inset-inline-end:-6px;display:flex;flex-direction:row-reverse;z-index:3}
.tk{width:20px;height:20px;border-radius:50%;background:var(--card);border:2px solid var(--pc);display:grid;place-items:center;font-size:.78rem;margin-inline-start:-6px;box-shadow:0 1px 3px rgba(0,0,0,.35)}
.tk.cur{transform:scale(1.25);z-index:4}
.center{min-width:0;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;padding:8px;gap:6px;direction:rtl}
.center .big{font-size:1rem;font-weight:700}
.center .mut{color:var(--muted);font-size:.8rem}
.dice{font-size:3.6rem;line-height:1;color:var(--brand);user-select:none}
.dice.roll{animation:shake .12s infinite}
@keyframes shake{0%{transform:rotate(-8deg)}50%{transform:rotate(8deg) scale(1.06)}100%{transform:rotate(-8deg)}}
.legend{display:flex;flex-wrap:wrap;gap:6px 10px;margin-top:10px;font-size:.72rem;color:var(--muted)}
.legend span{display:inline-flex;align-items:center;gap:4px}
.legend i{width:12px;height:12px;border-radius:4px;display:inline-block;border:1px solid rgba(0,0,0,.1)}
.log{max-height:190px;overflow:auto;font-size:.88rem}
.log h3{margin:0 0 6px;font-size:.9rem}
.log p{margin:0;padding:6px 0;border-bottom:1px dashed var(--line)}
.log p:first-of-type{font-weight:700}
button{font:inherit;border:0;border-radius:12px;padding:11px 16px;cursor:pointer;background:var(--brand);color:var(--brand-ink);font-weight:700;min-height:46px;transition:transform .08s,opacity .15s}
button:active{transform:scale(.97)}
button.alt{background:var(--soft);color:var(--ink);border:1px solid var(--line);font-weight:600}
button:disabled{opacity:.5;cursor:default}
.bar-actions{position:fixed;inset-inline:0;bottom:0;background:linear-gradient(transparent,var(--bg) 35%);padding:16px 14px calc(12px + env(safe-area-inset-bottom));z-index:5}
.bar-actions .in{max-width:720px;margin:0 auto;display:flex;gap:8px}
#roll{flex:1;font-size:1.1rem;box-shadow:0 4px 14px rgba(15,118,110,.35)}
.modal{position:fixed;inset:0;background:rgba(8,14,20,.55);display:none;align-items:flex-end;justify-content:center;padding:0;z-index:9}
@media(min-width:560px){.modal{align-items:center;padding:16px}}
.modal.on{display:flex}
.sheet{background:var(--card);border-radius:22px 22px 0 0;padding:18px 16px calc(18px + env(safe-area-inset-bottom));max-width:480px;width:100%;max-height:90vh;overflow:auto;animation:up .2s ease-out}
@media(min-width:560px){.sheet{border-radius:22px}}
@keyframes up{from{transform:translateY(24px);opacity:0}to{transform:none;opacity:1}}
.sheet h2{margin:0 0 8px;font-size:1.2rem}
.sheet h3{margin:14px 0 4px;font-size:1rem}
.sheet p{margin:6px 0}
.sheet table{width:100%;border-collapse:collapse;font-size:.92rem;margin:6px 0}
.sheet td,.sheet th{padding:6px 0;border-bottom:1px solid var(--line);vertical-align:top;text-align:start}
.sheet td:last-child{text-align:left;font-variant-numeric:tabular-nums;white-space:nowrap}
.sheet .row{display:flex;gap:8px;flex-wrap:wrap;margin-top:14px}
.sheet .row button{flex:1;min-width:110px}
.sub{color:var(--muted);font-size:.85rem}
.prof{display:block;width:100%;text-align:start;margin-bottom:8px;background:var(--soft);color:var(--ink);border:1px solid var(--line);font-weight:700}
.prof small{display:block;font-weight:400;color:var(--muted);margin-top:2px}
details summary{cursor:pointer;font-weight:700;padding:6px 0}
.tabs{display:flex;gap:6px;overflow:auto;margin:6px -2px 10px;padding:2px}
.tabs button{flex:none;min-height:38px;padding:7px 13px;font-size:.88rem;background:var(--soft);color:var(--ink);border:1px solid var(--line)}
.tabs button.on{background:var(--brand);color:var(--brand-ink);border-color:var(--brand)}
.tip{background:var(--soft);border-inline-start:4px solid var(--brand);border-radius:10px;padding:8px 10px;margin:10px 0;font-size:.9rem}
.tip.warn{border-color:var(--gold)}
dl{margin:6px 0}dt{font-weight:700;margin-top:10px}dd{margin:2px 0 0;color:var(--muted);font-size:.92rem}
.chip{display:inline-block;padding:1px 8px;border-radius:99px;font-size:.78rem;font-weight:700;color:#16202a}
.toast{position:fixed;top:12px;inset-inline:14px;margin:0 auto;max-width:420px;background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;font-size:.9rem;z-index:20;opacity:0;transform:translateY(-8px);transition:.25s;pointer-events:none;text-align:center}
.toast.on{opacity:1;transform:none}
.slot{display:grid;grid-template-columns:1fr 1fr;gap:6px;background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:8px;margin-bottom:8px}
.slot .t{grid-column:1/-1;display:flex;align-items:center;gap:6px;font-weight:700;font-size:.9rem}
.slot .t span{flex:1}
.slot .x{min-height:32px;padding:2px 10px;background:transparent;color:var(--bad);border:1px solid var(--line)}
select,input[type=text],textarea{font:inherit;width:100%;padding:9px 10px;border-radius:10px;border:1px solid var(--line);background:var(--card);color:var(--ink);min-height:42px}
textarea{direction:ltr;text-align:left;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:.72rem;min-height:120px;resize:vertical;word-break:break-all}
label.l{display:block;font-size:.8rem;color:var(--muted);margin:8px 0 3px}
.steps{counter-reset:s;padding:0;list-style:none;margin:8px 0}
.steps li{counter-increment:s;padding:4px 34px 4px 0;position:relative;font-size:.9rem}
.steps li::before{content:counter(s);position:absolute;inset-inline-start:auto;right:0;top:4px;width:24px;height:24px;border-radius:50%;background:var(--brand);color:var(--brand-ink);display:grid;place-items:center;font-size:.8rem;font-weight:700}
.rank td:first-child{width:1%;white-space:nowrap}
.event{margin:0 0 10px;padding:9px 12px;border-radius:12px;background:linear-gradient(90deg,#c8901a,#e0a82e);color:#241800;font-weight:700;font-size:.86rem;text-align:center;box-shadow:var(--shadow)}
.react-fab{position:fixed;inset-inline-start:14px;bottom:calc(88px + env(safe-area-inset-bottom));width:46px;height:46px;border-radius:50%;padding:0;font-size:1.4rem;z-index:6;background:var(--card);border:1px solid var(--line);box-shadow:0 3px 10px rgba(0,0,0,.25)}
.react-tray{position:fixed;inset-inline-start:14px;bottom:calc(142px + env(safe-area-inset-bottom));display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:30px;padding:6px 8px;z-index:6;box-shadow:0 4px 14px rgba(0,0,0,.25)}
.react-tray[hidden]{display:none}
.react-tray button{min-height:0;width:40px;height:40px;padding:0;font-size:1.3rem;background:var(--soft);border-radius:50%}
#floaters{position:fixed;inset:0;pointer-events:none;z-index:25;overflow:hidden}
.floater{position:absolute;bottom:130px;display:flex;flex-direction:column;align-items:center;animation:rise 2.4s ease-out forwards}
.floater .fe{font-size:2.4rem}.floater .fn{background:var(--ink);color:var(--bg);border-radius:8px;padding:1px 7px;font-size:.7rem}
@keyframes rise{0%{transform:translateY(0) scale(.6);opacity:0}15%{opacity:1;transform:translateY(-30px) scale(1.1)}100%{transform:translateY(-60vh) scale(1);opacity:0}}
.cf{position:fixed;top:-30px;animation:fall linear forwards;pointer-events:none}
@keyframes fall{to{transform:translateY(112vh) rotate(360deg)}}
.nmrow{grid-column:1/-1;display:flex;gap:6px}
.avsel{width:78px!important;flex:none;font-size:1.25rem}
.awards{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.award{background:var(--soft);border:1px solid var(--line);border-radius:12px;padding:4px 10px;font-size:.82rem}
.award b{display:block}
.who{display:flex;align-items:center;gap:10px;margin-bottom:10px}
.portrait{width:56px;height:56px;border-radius:50%;object-fit:cover;border:3px solid var(--brand);background:var(--soft);flex:none}
.portrait.big{width:84px;height:84px;display:block;margin:0 auto 8px}
.who .perk{font-size:.78rem;color:var(--gold);font-weight:700}
.hero{width:100%;height:124px;object-fit:cover;border-radius:14px;margin-bottom:10px}
.gh{display:flex;justify-content:space-between;align-items:center;margin-bottom:8px}
.ggrid{display:grid;grid-template-columns:repeat(6,1fr);gap:6px}
.gcell{position:relative;background:var(--soft);border-radius:12px;padding:6px 2px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:1px;min-width:0}
.gcell img{width:34px;height:34px;border-radius:8px;object-fit:cover}
.gcell b{font-size:.82rem;font-variant-numeric:tabular-nums}
.gcell small{font-size:.62rem;color:var(--muted);line-height:1.15}
.gq{position:absolute;top:-5px;inset-inline-end:-3px;background:var(--brand);color:var(--brand-ink);border-radius:99px;font-size:.68rem;font-weight:800;min-width:18px;padding:0 4px;text-align:center}
.profbtn{display:flex;align-items:center;gap:6px;background:var(--card);color:var(--ink);border:1px solid var(--line);min-height:42px;padding:4px 10px;font-weight:600;text-align:start}
.pi{width:28px;height:28px;border-radius:50%;object-fit:cover}
.pgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.pcard{display:flex;flex-direction:column;align-items:center;gap:2px;background:var(--soft);color:var(--ink);border:2px solid var(--line);padding:8px 6px;min-height:0}
.pcard.on{border-color:var(--brand)}
.pcard img{width:64px;height:64px;border-radius:50%;object-fit:cover}
.pcard .pdice{font-size:2.2rem;line-height:64px}
.pcard small{color:var(--muted);font-weight:400;font-size:.72rem}
.pcard .pk{color:var(--gold);font-weight:700;text-align:center;line-height:1.25}
.ords{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.ord{background:var(--soft);border-radius:10px;padding:5px 9px;font-size:.78rem}
.ord.open{border:1px dashed var(--gold)}
.welcome{text-align:center;padding:26px 14px}
.welcome .big{font-size:3rem}
.welcome button{display:block;width:100%;margin-top:10px}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="logo">🏁</div>
    <div><h1>درب الثراء</h1><p>من سباق الفئران إلى الحرية المالية</p></div>
    <div class="sp"><button class="hbtn" id="helpBtn" aria-label="كيف ألعب؟">؟</button></div>
  </header>

  <div id="welcome" class="card welcome" hidden>
    <img id="hero" class="hero" alt="">
    <h2>مرحباً بك في درب الثراء</h2>
    <p class="sub">العب وحدك، أو تنافس مع لاعب آلي، أو مع صديق على نفس الجهاز، أو مع صديق عن بُعد.</p>
    <button id="wNew">🎮 لعبة جديدة</button>
    <button class="alt" id="wJoin">🌐 انضمام إلى لعبة صديق</button>
  </div>

  <div id="game" hidden>
    <nav class="tabs" id="tabs">
      <button data-t="play" class="on">🎲 اللوحة</button><button data-t="me">👤 بطاقتي</button><button data-t="souk">🛒 السوق</button><button data-t="log">📜 السجل</button>
    </nav>
    <section class="pane on" data-p="play">
      <div class="event" id="event" hidden></div>
      <div class="chips" id="chips"></div>
      <div class="status" id="status"></div>
      <button class="mini" id="mini" type="button"></button>
      <div class="card">
        <div class="board" id="board"></div>
        <div class="legend" id="legend"></div>
      </div>
    </section>
    <section class="pane" data-p="me">
      <div class="card">
        <div class="who" id="who"></div>
        <div class="stats" id="stats"></div>
        <div class="clock" id="clock"></div>
        <div class="prog">
          <div class="prog-top"><span id="phase"></span><span id="progtxt"></span></div>
          <div class="bar" role="progressbar" aria-label="تقدم الخروج من سباق الفئران"><i id="prog"></i></div>
        </div>
      </div>
    </section>
    <section class="pane" data-p="souk"><div class="card" id="goodsCard"></div></section>
    <section class="pane" data-p="log"><div class="card log"><h3>📜 سجل الأحداث</h3><div id="log"></div></div></section>
  </div>
</div>

<div class="bar-actions"><div class="in">
  <button id="roll" disabled>🎲 ارمِ النرد</button>
  <button class="alt" id="sheetBtn" aria-label="قائمتي المالية">📋 القائمة</button>
  <button class="alt" id="menuBtn" aria-label="القائمة الرئيسية">☰</button>
</div></div>

<button class="react-fab" id="reactBtn" hidden aria-label="تفاعل">😀</button>
<div class="react-tray" id="reactTray" hidden></div>
<div id="floaters"></div>
<div class="modal" id="modal"><div class="sheet" id="sheet"></div></div>
<div class="toast" id="toast"></div>

<script>
(()=>{
"use strict";
const $=s=>document.querySelector(s);
const fmt=n=>Math.round(n).toLocaleString("en-US");
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const esc=s=>String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const SPEED=Math.max(1,+new URLSearchParams(location.search).get("speed")||1);
const sleep=ms=>new Promise(r=>setTimeout(r,ms/SPEED));
const KEY="darb-althara-v6", SEEN="darb-althara-help";
const FACES=["⚀","⚁","⚂","⚃","⚄","⚅"];

function audio(){

function tone(f,d,type,vol,when){
  if(!SOUND)return;const a=audio();if(!a)return;
  const t=a.currentTime+(when||0),o=a.createOscillator(),g=a.createGain();
  o.type=type||"sine";o.frequency.setValueAtTime(f,t);
  g.gain.setValueAtTime(0.0001,t);g.gain.exponentialRampToValueAtTime(vol||0.07,t+0.01);g.gain.exponentialRampToValueAtTime(0.0001,t+d);
  o.connect(g);g.connect(a.destination);o.start(t);o.stop(t+d+0.03);
}

function cleanHTML(html){
  const d=new DOMParser().parseFromString(`<div>${html}</div>`,"text/html");
  const out=document.createElement("div");
  const OK=["b","p","br","div","span","small","i","ul","li"];
  (function walk(src,dst){
    for(const n of src.childNodes){
      if(n.nodeType===3)dst.appendChild(document.createTextNode(n.nodeValue));
      else if(n.nodeType===1){
        const t=n.tagName.toLowerCase();
        if(OK.includes(t)){
          const e=document.createElement(t);
          if(/^(good|bad|sub|tip|warn)( (good|bad|sub|tip|warn))*$/.test(n.className||""))e.className=n.className;
          dst.appendChild(e);walk(n,e);
        }else walk(n,dst);
      }
    }
  })(d.body.firstChild,out);
  return out.innerHTML;
}

async function ensureCash(p,amount,forced,ctx){
  if(p.cash>=amount)return true;
  const need=Math.ceil((amount-p.cash)/1000)*1000;
  const idx=await ask(p,{kind:"loan",title:"🏦 تحتاج إلى قرض",
    body:`<p>ينقصك ${fmt(amount-p.cash)}. البنك يقرضك <b>${fmt(need)}</b> بقسط شهري ${fmt(need*0.1)} (10%) يُضاف إلى مصاريفك.</p>`,
    opts:forced?["اقترض"]:["اقترض","لا"],alt:forced?[false]:[false,true],data:{need,forced,inc:ctx?ctx.inc:0}});
  if(forced||idx===0){p.cash+=need;p.loans+=need;p.st.loans+=need;log(`🏦 ${p.name} اقترض ${fmt(need)}.`);return true}
  return false;
}
function pay(p){
  const amt=p.fast?passive(p)*12:cashflow(p);
  p.months+=p.fast?12:1;
  p.cash+=amt;
  log(`💰 ${p.name}: يوم الراتب (الشهر ${p.months}) ${amt>=0?"+":""}${fmt(amt)}`);
  if(amt>0)cue("pay",p);
  if(p.cash<0){
    const need=Math.ceil(-p.cash/1000)*1000;
    p.cash+=need;p.loans+=need;p.st.loans+=need;
    log(`🏦 رصيد ${p.name} سالب، فاقترض ${fmt(need)} تلقائياً.`);
  }
}
async function takeTurn(p){
  p.turns++;
  if(p.skip>0){p.skip--;log(`⏸️ فاتك الدور يا ${p.name} (تسريح). متبقٍ ${p.skip}.`);sync();await w(600);return}
  const dice=p.charity>0&&!p.fast?2:1;
  if(p.charity>0)p.charity--;
  G.phase="move";G.rolling=true;cue("roll");sync();await w(560);G.rolling=false;
  let d=0;const ds=[];for(let i=0;i<dice;i++){const x=1+Math.floor(Math.random()*6);ds.push(x);d+=x}
  G.dice=ds[0];p.last=ds[0];
  log(`🎲 ${p.name} رمى ${ds.join(" + ")}${dice>1?" = "+d:""} (${thr(p.turns)}).`);sync();await w(250);
  const track=p.fast?FAST:RAT;
  for(let i=0;i<d;i++){
    p.pos=(p.pos+1)%track.length;
    if(track[p.pos]==="payday"&&i<d-1)pay(p);
    playCue("step");sync();await w(150);
  }
  await w(150);
  await resolveTile(p,track[p.pos]);
  if(over()||G.placed.includes(p.id))return;
  if(!p.fast&&passive(p)>0&&passive(p)>=exitNeed(p)){
    const bonus=passive(p)*40;
    Object.keys(p.inv).forEach(k=>doSell(p,GOODS.find(g=>g.k===k),p.inv[k].q));
    p.fast=true;p.pos=0;p.cash+=bonus;p.st.exitRound=G.round;
    log(`🎉 ${p.name} خرج من سباق الفئران! مكافأة ${fmt(bonus)}.`);
    if(G.players.length>1)flash(`🚀 ${p.name} خرج من سباق الفئران!`);
    cue("exit");
    await ack(p,"🎉 مبروك! خرجت من سباق الفئران",`<p>دخلك التلقائي (${fmt(passive(p))}) صار يغطي مصاريفك. دخلت <b>المسار السريع</b> بنقد ${fmt(p.cash)}.</p><div class="tip">الهدف الآن: اشترِ أحد الأحلام الثلاثة على اللوحة قبل منافسيك.</div>`,"هيا 🚀");
  }
}

    return}

    return offer(p,i===0?hd(rnd(SMALL)):hd(rnd(BIG)))}
  case"biz":return offer(p,hd(rnd(BIZ)));
  case"dream":{
    const d=DREAMS[FAST.slice(0,p.pos).filter(x=>x==="dream").length];
    const dc=dreamCost(d),afford=p.cash>=dc;
    const i=await ask(p,{kind:"dream",title:`⭐ ${d.n}`,body:`<p>السعر: <b>${fmt(dc)}</b> — نقدك ${fmt(p.cash)}.</p>`,opts:afford?["حقّق الحلم","لاحقاً"]:["لا يكفي النقد"],alt:afford?[false,true]:[true],data:{afford}});
    if(afford&&i===0){
      p.cash-=dc;win(p,d);
      if(!over()&&!isBot(p)){const n=G.placed.indexOf(p.id)+1;await ack(p,`🏅 حققت حلمك! المركز ${n}`,`<p>مبروك، <b>${esc(d.n)}</b> صار لك.</p><p class="sub">أنت الآن في المركز ${n}، وتنتظر انتهاء الباقين من أدوارهم. تابع منافسيك على الشاشة.</p>`,"أتابع المنافسين")}
    }

  }
}
async function offer(p,c){
  const dd=(p.perk.downDisc&&p.perk.downDisc[c.t])||0;
  if(dd)c={...c,down:Math.round(c.down*(1-dd)/100)*100};
  const inc=c.inc?`الدخل الشهري الصافي: <b class="good">+${fmt(c.inc)}</b>`:"لا دخل شهرياً — الربح من إعادة البيع.";
  const i=await ask(p,{kind:"offer",title:c.n,
    body:`<p>النوع: ${c.t}${c.cost?` — القيمة: ${fmt(c.cost)}`:""}<br>الدفعة الأولى: <b>${fmt(c.down)}</b><br>${inc}</p><p class="sub">نقدك: ${fmt(p.cash)}</p>`,
    opts:["اشترِ","تجاوز"],alt:[false,true],data:{down:c.down,inc:c.inc,cost:c.cost||c.down,t:c.t}});
  if(i!==0)return;
  if(!(await ensureCash(p,c.down,false,c)))return;
  p.cash-=c.down;p.assets.push({n:c.n,t:c.t,inc:c.inc,cost:c.cost||c.down});
  log(`✅ ${p.name} اشترى «${c.n}» بدفعة ${fmt(c.down)}.`);cue("buy",p);
  if(G.players.length>1&&c.down>=100000)flash(`💼 ${p.name} اشترى «${c.n}»!`);
}
async function market(p){
  const owned=p.assets.filter(a=>a.cost);
  if(!owned.length){log(`📈 السوق نشط لكن ${p.name} لا يملك أصولاً للبيع.`);return}
  const a=rnd(owned);
  const f=hard()?(a.t==="أسهم"?0.45+Math.random()*2.1:1.0+Math.random()*0.8):(a.t==="أسهم"?0.5+Math.random()*2.2:1.05+Math.random()*0.9);
  const price=Math.round(a.cost*f/100)*100, gain=price-a.cost;
  const i=await ask(p,{kind:"market",title:"📈 عرض من السوق",
    body:`<p>مشترٍ يعرض <b>${fmt(price)}</b> على «${a.n}» (قيمتها ${fmt(a.cost)}).<br>${gain>=0?"ربح":"خسارة"}: <b class="${gain>=0?"good":"bad"}">${fmt(Math.abs(gain))}</b></p><p class="sub">لو بعت، تخسر دخلها الشهري ${fmt(a.inc)}.</p>`,
    opts:["بِع","احتفظ"],alt:[false,true],data:{price,cost:a.cost,inc:a.inc,t:a.t}});
  if(i===0){p.cash+=price;p.assets.splice(p.assets.indexOf(a),1);cue("pay",p);log(`📈 ${p.name} باع «${a.n}» بـ ${fmt(price)}.`)}
}
async function partner(p){
  const c=hd(rnd(BIG)),half=Math.round(c.down/2/100)*100,halfInc=Math.round(c.inc/2);

function standings(){

  const pi=id=>{const i=G.placed.indexOf(id);return i<0?99:i};
  rows.sort((a,b)=>(pi(a.id)-pi(b.id))||(b.won-a.won)||(b.fast-a.fast)||((b.passive/b.exp)-(a.passive/a.exp)));
  return rows;

function win(p,d){

async function loop(){
  const my=RUN;
  try{
    while(!over()&&my===RUN){
      const p=G.players[G.cur];
      if(G.placed.includes(p.id)){G.cur=(G.cur+1)%G.players.length;if(G.cur===0){G.round++;rollEvent()}continue}
      G.phase="await_roll";saveLocal();sync();
      if(isBot(p)){botOrders(p);sync();await w(750+Math.random()*500)}else await waitRoll(p);
      if(my!==RUN)return;
      await takeTurn(p);
      if(over()||my!==RUN)break;
      G.cur=(G.cur+1)%G.players.length;
      if(G.cur===0){G.round++;rollEvent()}
    }
    if(my===RUN){sync();clearSave()}
  }catch(e){if(e!=="cancel")throw e}
}

/* ---------- لاعب آلي ---------- */
function botChoose(p,pr,secret){
  const L=lv(p),pro=L>=3,d=pr.data||{};
  const PB=at(p,[0,70,40,44,48]); // أقصى مدة استرداد مقبولة بالأشهر
  switch(pr.kind){
  case"order":return d.canNow?0:((pro||Math.random()<at(p,[0.4,0.6]))?0:1);
  case"tradeoffer":return(pro?d.u<=d.m*at(p,[1,1,1.02,1.0,0.98]):Math.random()<0.5)?0:1;
  case"family":{
    const costs=d.costs||[],last=costs.length-1;
    const aff=costs.map((c,i)=>({c,i})).filter(x=>x.c>0&&p.cash-x.c>=expenses(p)*2);
    if(!aff.length)return last;
    if(!pro)return Math.random()<0.5?last:aff[0].i;
    return aff.sort((a,b)=>b.c-a.c)[0].i}
  case"duelpick":return Math.random()<0.6?Math.floor(Math.random()*(pr.opts.length-1)):pr.opts.length-1;
  case"partnerpick":return pro?(d.payback<=PB?0:d.n+1):(Math.random()<0.5?0:d.n+1);
  case"partner":return(pro?d.inc>0&&d.down/d.inc<=PB:Math.random()<0.55)?0:1;
  case"quiz":{const ok=Math.random()<at(p,[0.4,0.55,0.75,0.88,0.97]);return ok?secret:(secret+1+Math.floor(Math.random()*2))%3}
  case"auction":{const payback=d.inc>0?d.down/d.inc:Infinity;return(pro?payback<=PB+5:(p.cash-d.down>=0&&Math.random()<at(p,[0.5,0.65])))?0:1}
  case"dealsize":return p.cash>=at(p,[110000,90000,70000,55000,45000])?1:0;
  case"offer":{
    const payback=d.inc>0?d.down/d.inc:Infinity,after=p.cash-d.down;
    if(d.inc<=0)return(pro&&after>expenses(p)*5&&Math.random()<0.4)?0:1;
    if(pro)return(payback<=PB&&(L<4||after>=expenses(p)*at(p,[0,0,0,0.5,0.3])))?0:1;
    if(L===2)return(after>=0&&payback<=PB)?0:1;
    return(after>=0&&Math.random()<0.6)?0:1}
  case"loan":
    if(d.forced)return 0;
    return(d.need*0.1<=d.inc*at(p,[0.25,0.4,0.6,0.8,1.0]))?0:1;
  case"market":{
    const gain=d.price-d.cost;
    if(pro)return(gain>=d.cost*at(p,[1,1,0.5,0.45,0.4])&&(d.inc<=0||d.inc*24<gain))?0:1;
    return(gain>0&&Math.random()<0.6)?0:1}
  case"charity":return pro?(p.cash>=d.c*3?0:1):(Math.random()<0.4?0:1);
  default:return 0;
  }
}

function perimeter(n){
  const a=[];
  for(let c=0;c<n;c++)a.push([0,c]);
  for(let r=1;r<n;r++)a.push([r,n-1]);
  for(let c=n-2;c>=0;c--)a.push([n-1,c]);
  for(let r=n-2;r>=1;r--)a.push([r,0]);
  return a;
}

  G.log.forEach(t=>{const p=document.createElement("p");p.textContent=t;lg.appendChild(p)});

  // النرد المتحرك
  if(G.rolling&&!diceTimer){diceTimer=setInterval(()=>{const d=$("#dice");if(d)d.textContent=rnd(FACES)},80/SPEED)}
  if(!G.rolling&&diceTimer){clearInterval(diceTimer);diceTimer=null}

  // الزر السفلي والحالة
  const myTurn=isMine(cp)&&G.phase==="await_roll"&&!G.prompt&&!over();
  const rb=$("#roll");
  if(over()){rb.textContent="🏁 انتهت اللعبة";rb.disabled=true}
  else if(myTurn){rb.textContent=Net.role==="solo"&&G.players.filter(x=>x.ctrl==="local").length<2?"🎲 ارمِ النرد":`🎲 ارمِ يا ${cp.name}`;rb.disabled=false;rb.textContent+=` · ${thr(cp.turns+1)}`}
  else{rb.textContent=`⏳ دور ${cp.name}`;rb.disabled=true}
  const pr=G.prompt;
  $("#status").textContent=(pr&&!isMine(G.players[pr.pid]))?`⏳ ${G.players[pr.pid].name} يقرر…`:"";

  renderPrompt();
  if(over()){if(!resultShown){resultShown=true;showResult();confetti()}}else resultShown=false;
}
function renderPrompt(){
  const pr=G.prompt;
  if(!pr){if(modalKind==="prompt")closeModal();shownPrompt=0;return}
  if(!isMine(G.players[pr.pid])){if(modalKind==="prompt")closeModal();return}
  if(shownPrompt===pr.id)return;
  shownPrompt=pr.id;
  const btns=pr.opts.map((l,i)=>[l,()=>answer(pr.id,i),pr.alt&&pr.alt[i]]);
  openModal("prompt",esc(pr.title),cleanHTML(pr.body),btns,true);
  if(pr.kind==="quiz")$("#sheet .row").style.flexDirection="column";
}
function answer(id,i){
  if(Net.role==="guest")send({t:"choose",id,idx:i});
  else answerAsk(id,i);
}

function openModal(kind,title,body,btns,keep){
  modalKind=kind;
  $("#sheet").innerHTML=`<h2>${title}</h2>${body}<div class="row"></div>`;
  const row=$("#sheet .row");
  (btns||[]).forEach(([label,fn,alt])=>{
    const b=document.createElement("button");b.textContent=label;if(alt)b.className="alt";
    b.onclick=()=>{closeModal();fn&&fn()};row.appendChild(b);
  });
  $("#modal").classList.add("on");
}

  openModal("result",mine?"🏆 فزت!":`🏁 فاز ${esc(win.name)}`,
    `${Object.prototype.hasOwnProperty.call(IMG,win.pk)?`<img class="portrait big" src="${IMG[win.pk]}" alt="">`:""}<p>${mine?"حققت حلمك":esc(win.name)+" حقق حلمه"}: <b>${esc(s.dream)}</b>${G.players.length>2?" وأكمل الباقون اللعب حتى تحدد المراكز":""} · الجولة ${G.round}.</p>

function shareResult(){

function rematch(){

function sheet(p){
  const own=isMine(p);
  const ex=Object.entries(p.exp).map(([k,v])=>`<tr><td>${esc(k)}</td><td>${fmt(v)}</td></tr>`).join("");
  const as=p.assets.length?p.assets.map(a=>`<tr><td>${esc(a.n)}<br><span class="sub">${esc(a.t)}</span></td><td class="good">${a.inc?"+"+fmt(effInc(a))+(effInc(a)!==a.inc?` <small class="sub">(الأساسي ${fmt(a.inc)})</small>`:""):"—"}</td></tr>`).join(""):`<tr><td colspan="2" class="sub">لا أصول بعد.</td></tr>`;
  const btns=[["إغلاق",null,true]];
  const canRepay=own&&p.loans>0&&p.cash>=1000&&G.phase==="await_roll"&&G.players[G.cur]===p&&!G.prompt;
  if(canRepay)btns.unshift(["سدّ قرضاً 1,000",()=>{if(Net.role==="guest")send({t:"repay"});else repay(p.id)}]);
  const canAct=own&&G.phase==="await_roll"&&G.players[G.cur]===p&&!G.prompt;
  const myOrds=[...p.orders,...G.openOrders];
  if(canAct)myOrds.filter(o=>canFill(p,o)).forEach(o=>{const g=GOODS.find(x=>x.k===o.k);btns.unshift([`📦 سلّم ${o.who} (${o.q} ${g?g.n:""} = ${fmt(o.u*o.q)})`,()=>{if(Net.role==="guest")send({t:"deliver",id:o.id});else deliver(p.id,o.id)}])});
  const ordHtml=myOrds.length?`<details open><summary>📦 الطلبات (${myOrds.length})</summary><table>${myOrds.map(o=>{const g=GOODS.find(x=>x.k===o.k);return `<tr><td>${esc(o.e)} ${esc(o.who)}${o.open?" 🌐":""}<br><span class="sub">${o.q} ${g?esc(g.n):""} × ${fmt(o.u)} · متبقٍ ${o.left} جولات</span></td><td class="good">${fmt(o.u*o.q)}</td></tr>`}).join("")}</table></details>`:"";
  openModal("sheet",`📋 قائمة ${esc(p.name)} (${esc(p.prof)})`,
   `<table><tr><td>الراتب</td><td>${fmt(p.salary)}</td></tr><tr><td>الدخل التلقائي</td><td class="good">${fmt(passive(p))}</td></tr>
    <tr><td>إجمالي المصاريف</td><td class="bad">${fmt(expenses(p))}</td></tr><tr><td><b>التدفق الشهري</b></td><td><b>${fmt(cashflow(p))}</b></td></tr></table>
    <details><summary>المصاريف بالتفصيل</summary><table>${ex}<tr><td>أطفال (${p.children})</td><td>${fmt(p.children*p.childCost)}</td></tr><tr><td>أقساط القروض (${fmt(p.loans)})</td><td>${fmt(p.loans*loanRate())}</td></tr></table></details>
    <details open><summary>الأصول (مصادر الدخل التلقائي)</summary><table>${as}</table></details>${ordHtml}${Object.keys(p.inv).length?`<details><summary>📦 المخزون (${invCount(p)}/${INV_CAP})</summary><table>${Object.entries(p.inv).map(([k,o])=>{const g=GOODS.find(x=>x.k===k);return g?`<tr><td>${g.e} ${g.n} ×${o.q}</td><td>${fmt(o.c)}</td></tr>`:""}).join("")}</table></details>`:""}<p class="sub">⭐ ميزة المهنة: ${esc(p.pt||"—")}<br>❤️ دفء العائلة: ${(p.st&&p.st.love)||0} · 👥 شراكات: ${(p.st&&p.st.partner)||0} · 🧳 أرباح التجارة: ${fmt((p.st&&p.st.trade)||0)}</p><p class="sub">${esc(p.debt)} (مدرج ضمن قسط السكن)</p>`,btns);
}
function repay(pid){
  const p=G.players[pid];
  if(!p||p.loans<1000||p.cash<1000||G.phase!=="await_roll"||G.players[G.cur]!==p||G.prompt)return;
  p.cash-=1000;p.loans-=1000;log(`🏦 ${p.name} سدّد 1,000 من القرض.`);sync();
}

/* ---------- الشبكة (WebRTC بلا خادم) ---------- */
const ICE=[{urls:["stun:stun.l.google.com:19302","stun:stun1.l.google.com:19302"]}];
const b64u=u8=>btoa(String.fromCharCode(...u8)).replace(/\+/g,"-").replace(/\//g,"_").replace(/=+$/,"");
const unb64u=s=>Uint8Array.from(atob(s.replace(/-/g,"+").replace(/_/g,"/")+"=".repeat((4-s.length%4)%4)),c=>c.charCodeAt(0));
async function pack(obj){
  const raw=new TextEncoder().encode(JSON.stringify(obj));
  if(window.CompressionStream){
    const cs=new CompressionStream("deflate-raw"),wr=cs.writable.getWriter();wr.write(raw);wr.close();
    return"DARB1C"+b64u(new Uint8Array(await new Response(cs.readable).arrayBuffer()));
  }
  return"DARB1R"+b64u(raw);
}
async function unpack(code){
  code=String(code||"").replace(/\s+/g,"");
  if(!/^DARB1[CR][A-Za-z0-9_-]+$/.test(code)||code.length>20000)throw new Error("bad");
  const body=unb64u(code.slice(6));let raw=body;
  if(code[5]==="C"){
    if(!window.DecompressionStream)throw new Error("nodec");
    const ds=new DecompressionStream("deflate-raw"),wr=ds.writable.getWriter();wr.write(body);wr.close();
    raw=new Uint8Array(await new Response(ds.readable).arrayBuffer());
  }
  const o=JSON.parse(new TextDecoder().decode(raw));
  if(!o||typeof o.sdp!=="string"||!o.sdp.startsWith("v=0")||o.sdp.length>16000||(o.t!=="offer"&&o.t!=="answer"))throw new Error("bad");
  return o;
}
function gather(pc){
  return new Promise(res=>{
    if(pc.iceGatheringState==="complete")return res();
    const done=()=>{pc.removeEventListener("icegatheringstatechange",chk);res()};
    const chk=()=>{if(pc.iceGatheringState==="complete")done()};
    pc.addEventListener("icegatheringstatechange",chk);
    setTimeout(done,3500);
  });
}
function send(o){try{if(Net.dc&&Net.dc.readyState==="open")Net.dc.send(JSON.stringify(o))}catch(e){}}
function closeNet(keepRole){
  try{Net.dc&&Net.dc.close()}catch(e){}
  try{Net.pc&&Net.pc.close()}catch(e){}
  Net.pc=null;Net.dc=null;Net.open=false;Net.lobby=null;Net.onJoined=null;Net.remotePid=null;Net.myPid=null;
  if(!keepRole)Net.role="solo";
}
function setupDC(dc){
  Net.dc=dc;
  dc.onopen=()=>{Net.open=true;if(Net.role==="guest-pending")send({t:"hello",name:Net.helloName,prof:Net.helloProf,av:Net.helloAv})};
  dc.onmessage=e=>{
    if(typeof e.data!=="string"||e.data.length>200000)return;
    let m;try{m=JSON.parse(e.data)}catch(x){return}
    if(!m||typeof m.t!=="string")return;
    if(Net.role==="guest"||Net.role==="guest-pending")onGuestMsg(m);else onHostMsg(m);
  };
  dc.onclose=()=>onDisconnect();
  Net.pc.onconnectionstatechange=()=>{
    const s=Net.pc&&Net.pc.connectionState;
    if(s==="failed"||s==="closed")onDisconnect();
    else if(s==="disconnected")setTimeout(()=>{if(Net.pc&&Net.pc.connectionState==="disconnected")onDisconnect()},8000);
  };
}
let discDone=false;
function onDisconnect(){
  if(discDone)return;
  if(Net.role==="host"&&G&&Net.remotePid!=null){
    discDone=true;
    const p=G.players[Net.remotePid];
    if(p&&p.ctrl==="remote"){
      p.ctrl="bot2";p.name=p.name+" 🤖";
      log(`🔌 انقطع اتصال ${p.name}. سيكمل اللاعب الآلي مكانه.`);
      Net.open=false;
      if(pending.roll&&pending.roll.pid===p.id)actRoll(p.id);
      if(pending.ask&&pending.ask.pid===p.id)answerAsk(pending.ask.id,botChoose(p,pending.ask.pr,pending.ask.secret));
      toast("انقطع اتصال صديقك — أكمل اللاعب الآلي مكانه");sync();
    }
  }else if(Net.role==="guest"||Net.role==="guest-pending"){
    discDone=true;Net.open=false;
    toast("انقطع الاتصال بالمضيف");
    if(modalKind!=="join")openModal("disc","🔌 انقطع الاتصال","<p>انقطع الاتصال بصاحب اللعبة. يمكنك بدء لعبة جديدة بالقائمة ☰.</p>",[["حسناً",null]]);
  }
}
function sanitizeName(s){return String(s||"").replace(/[\u0000-\u001f\u007f<>]/g,"").trim().slice(0,14)||"صديقك"}

/* المضيف يستقبل */
function onHostMsg(m){
  if(m.t==="hello"){
    if(Net.lobby)Net.lobby({name:sanitizeName(m.name),prof:Number.isInteger(m.prof)?m.prof:-1,av:AVATARS.includes(m.av)?m.av:null});
    return;
  }
  if(!G||Net.remotePid==null)return;
  if(m.t==="roll")actRoll(Net.remotePid);
  else if(m.t==="choose"){
    const a=pending.ask;
    if(a&&a.pid===Net.remotePid&&Number.isInteger(m.id)&&Number.isInteger(m.idx))answerAsk(m.id,m.idx);
  }else if(m.t==="deliver"){if(Number.isInteger(m.id))deliver(Net.remotePid,m.id)}
  else if(m.t==="repay")repay(Net.remotePid);
  else if(m.t==="react"){
    if(REACTS.includes(m.e)&&Date.now()-lastRemoteReact>600){lastRemoteReact=Date.now();const q=G.players[Net.remotePid];floatReact(q.name,q.avatar,m.e);send({t:"react",pid:Net.remotePid,e:m.e})}
  }
}
/* الضيف يستقبل */
function onGuestMsg(m){
  if(m.t==="welcome"&&Number.isInteger(m.pid)){
    Net.myPid=m.pid;Net.role="guest";lastFlash=null;
    if(Net.onJoined)Net.onJoined();
  }else if(m.t==="state"&&m.G&&Array.isArray(m.G.players)){
    G=m.G;
    if(Net.role==="guest"){
      if(modalKind==="join")closeModal();
      if(modalKind==="result"&&!over())closeModal();
      render();
    }
  }else if(m.t==="cue"&&typeof m.c==="string"&&Net.role==="guest"){
    localCue(m.c,Number.isInteger(m.pid)?m.pid:null);
  }else if(m.t==="react"&&G&&Net.role==="guest"){
    const q=G.players[m.pid];if(q&&REACTS.includes(m.e))floatReact(q.name,q.avatar,m.e);
  }
}

  $("#sheet").innerHTML=`<h2>🌐 انضمام إلى لعبة صديق</h2>
    <label class="l">اسمك</label><input type="text" id="jName" maxlength="14" value="ضيف">
    <label class="l">صورتك</label><select id="jAv" class="avsel" style="width:100%!important">${AVATARS.map(a=>`<option>${a}</option>`).join("")}</select>
    <label class="l">مهنتك</label><select id="jProf">${profOpts}</select>
    <label class="l">رمز الدعوة من صديقك</label><textarea id="jCode" placeholder="الصق الرمز هنا"></textarea>
    <div class="row"><button id="jMake">إنشاء رمز الرد</button></div>
    <div id="jOut"></div><p class="sub" id="jMsg"></p>
    <div class="row"><button class="alt" id="jCancel">إلغاء</button></div>`;
  $("#modal").classList.add("on");
  $("#jCancel").onclick=()=>{closeNet(false);closeModal();render()};
  $("#jMake").onclick=async()=>{
    try{
      $("#jMsg").textContent="جارٍ التجهيز…";
      const o=await unpack($("#jCode").value);
      if(o.t!=="offer")throw new Error("bad");
      Net.helloName=sanitizeName($("#jName").value);Net.helloProf=+$("#jProf").value;Net.helloAv=$("#jAv").value;
      const pc=new RTCPeerConnection({iceServers:ICE});Net.pc=pc;Net.role="guest-pending";
      pc.ondatachannel=e=>setupDC(e.channel);
      await pc.setRemoteDescription({type:"offer",sdp:o.sdp});
      await pc.setLocalDescription(await pc.createAnswer());await gather(pc);
      const code=await pack({t:"answer",sdp:pc.localDescription.sdp});
      Net.onJoined=()=>{closeModal();toast("✅ تم الاتصال. استمتع باللعب!")};
      $("#jOut").innerHTML=`<label class="l">رمز الرد (انسخه وأرسله لصديقك)</label><textarea id="jAns" readonly>${code}</textarea>
        <div class="row"><button class="alt" id="jCopy">📋 نسخ</button><button class="alt" id="jShare">📤 مشاركة</button></div>`;
      $("#jCopy").onclick=()=>copyText($("#jAns").value);
      $("#jShare").onclick=()=>shareText($("#jAns").value);
      $("#jMsg").textContent="بعد أن يلصق صديقك الرمز ويضغط «اتصال» ستبدأ اللعبة تلقائياً…";
      $("#jMake").disabled=true;
    }catch(e){$("#jMsg").textContent="رمز الدعوة غير صحيح. انسخه كاملاً وحاول مجدداً."}
  };
}
async function copyText(t){
  try{await navigator.clipboard.writeText(t);toast("تم النسخ ✅");return}catch(e){}
  try{const ta=document.createElement("textarea");ta.value=t;document.body.appendChild(ta);ta.select();document.execCommand("copy");ta.remove();toast("تم النسخ ✅")}catch(e){toast("انسخ الرمز يدوياً")}
}
async function shareText(t){
  if(navigator.share){try{await navigator.share({text:t});return}catch(e){}}
  copyText(t);
}

/* ---------- القائمة والأزرار ---------- */
function menu(){
  const btns=[
    ["🎮 لعبة جديدة",()=>{if(!G||over()||confirm("بدء لعبة جديدة؟ سيُمسح التقدم الحالي."))openSetup()}],
    ["🌐 انضمام لصديق",()=>{if(!G||over()||Net.role==="guest"||confirm("ستترك اللعبة الحالية. متابعة؟"))openJoin()}],
    ...(Net.role!=="guest"&&G&&!over()&&G.placed.length?[["🏁 أنهِ المباراة الآن (ترتيب الباقين بتقدمهم)",()=>{if(confirm("إنهاء المباراة وترتيب الباقين حسب تقدمهم الحالي؟"))endNow()},true]]:[]),
    ["❓ كيف ألعب؟",()=>help(0)],
    [SOUND?"🔊 الصوت: يعمل":"🔇 الصوت: مكتوم",()=>{SOUND=!SOUND;try{localStorage.setItem("darb-sound",SOUND?"1":"0")}catch(e){}toast(SOUND?"تم تشغيل الصوت":"تم كتم الصوت");if(SOUND)playCue("good")},true],
    ["إغلاق",null,true]];
  openModal("menu","☰ القائمة","",btns);
  $("#sheet .row").style.flexDirection="column";
}
$("#roll").onclick=()=>{
  if(!G)return;
  if(Net.role==="guest")send({t:"roll"});else actRoll(G.players[G.cur].id);
};
$("#sheetBtn").onclick=()=>{if(G)sheet(viewP())};
$("#menuBtn").onclick=menu;
$("#helpBtn").onclick=()=>help(0);
REACTS.forEach(e=>{const b=document.createElement("button");b.textContent=e;b.onclick=()=>{sendReact(e);$("#reactTray").hidden=true};$("#reactTray").appendChild(b)});
$("#reactBtn").onclick=()=>{$("#reactTray").hidden=!$("#reactTray").hidden};
document.addEventListener("pointerdown",()=>audio(),{once:true});
$("#wNew").onclick=()=>openSetup();
$("#wJoin").onclick=()=>openJoin();
$("#modal").addEventListener("click",e=>{if(e.target.id==="modal"&&["sheet","menu","help","result"].includes(modalKind))closeModal()});

/* ---------- البداية ---------- */
if(loadSaved()){render();loop()}
else{
  render();
  let seen=false;try{seen=localStorage.getItem(SEEN)}catch(e){}
  if(!seen)help(0);
}
$("#hero").src=IMG.hero;
// للاختبار الآلي فقط
window.__darb={get G(){return G},get Net(){return Net},setFamilyDeck(a){FDECK=a}};
})();
</script>
