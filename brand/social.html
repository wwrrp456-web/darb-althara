<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><link rel="stylesheet" href="../styles/identity.css"><style>*{box-sizing:border-box}body{margin:0;padding:0;background:#f8f3e8;color:#183e35;width:100vw;height:100vh;overflow:hidden}.promo{display:grid;grid-template-columns:1fr 1fr;height:100%;position:relative}.visual{grid-column:2;grid-row:1;background:url('../art/identity/world-sheet.png') 0 0/300% 200%;position:relative}.visual:after{content:"";position:absolute;inset:0;box-shadow:inset -20px 0 40px #124c4010}.copy{grid-column:1;grid-row:1;padding:54px;display:flex;flex-direction:column;align-items:flex-start;justify-content:center}.lock{display:flex;gap:14px;align-items:center;margin-bottom:40px}.lock img{width:62px;height:62px}.lock b{font-size:32px}.label{color:#8d6829;font-size:18px;letter-spacing:1px}h1{font-size:66px;line-height:1.25;margin:15px 0 20px}h1 em{font-style:normal;color:#8d6829}p{font-size:23px;line-height:1.8;margin:0 0 25px}.tag{font-size:17px;border-top:1px solid #e2dccb;padding-top:22px;width:100%;color:#68756b}.cta{background:#124c40;color:#fffdf8;border-radius:14px;padding:13px 25px;font-size:24px;font-weight:700;margin-bottom:26px}@media(max-aspect-ratio:1/1){.promo{grid-template-columns:1fr;grid-template-rows:46% 54%}.visual{grid-column:1;grid-row:1;background-size:300% 200%}.copy{grid-column:1;grid-row:2;padding:40px 64px}.lock{margin-bottom:16px}.lock img{width:56px;height:56px}.lock b{font-size:30px}h1{font-size:74px;margin:10px 0}h1 br{display:none}p{font-size:25px;margin-bottom:18px}.label{font-size:18px}.cta{font-size:23px;margin-bottom:15px}.tag{padding-top:15px;font-size:17px}}
