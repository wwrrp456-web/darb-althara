<!doctype html><html lang="ar" dir="rtl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../../"><title>مراجعة حدود الرسومات</title><link rel="stylesheet" href="styles/sprite-regions.css"><style>*{box-sizing:border-box}body{font:16px/1.5 sans-serif;background:#f8f5ed;color:#263f47;margin:0;padding:24px}h1,h2{text-align:center}.grid{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;direction:ltr}.cell{background:#fffdf8;border:1px solid #dcded3;border-radius:16px;display:flex;flex-direction:column;align-items:center;padding:8px}.sample{display:block;width:140px;height:140px}.cell small{font-size:14px;direction:ltr}.sizes{display:flex;gap:12px;align-items:center;justify-content:center;background:white;padding:16px}.sizes span{display:inline-block}section{margin-block:32px}</style><h1>مراجعة الرسومات: صورة واحدة كاملة داخل كل إطار</h1><p style="text-align:center">الأصول الأصلية محفوظة؛ هذه مراجعة لطريقة العرض والحدود والمساحة الآمنة.</p><main></main><script src="scripts/sprite-regions.js"></script><script>
for(const [name,sheet]of Object.entries(DarbSprites.sheets)){const section=document.createElement('section');section.id=name;const title=document.createElement('h2');title.textContent=name+' · '+sheet.regions.length;section.append(title);const grid=document.createElement('div');grid.className='grid';for(let i=0;i<sheet.regions.length;i++){const cell=document.createElement('div');cell.className='cell';const frame=document.createElement('span');frame.className='sample';DarbSprites.paint(frame,name,i,name==='avatars'?0:name.startsWith('card')?4:6);const label=document.createElement('small');label.textContent=(name==='icons'?DarbSprites.names[i]:name==='extra'?DarbSprites.extraNames[i]:i+1);cell.append(frame,label);grid.append(cell);}section.append(grid);document.querySelector('main').append(section);}
const comparison=document.createElement('section');comparison.id='case-comparison';comparison.innerHTML='<h2>الشنطة: الاقتطاع السابق ثم العرض المصحح</h2><div class="sizes" style="direction:ltr"><div style="text-align:center"><b>قبل</b><span id="case-before" style="display:block;width:200px;height:200px;background:url(art/identity/icons-sheet.png) 40% 20%/600% 600% no-repeat;border-radius:24%"></span></div><div style="text-align:center"><b>بعد</b><span id="case-after" style="display:block;width:200px;height:200px"></span></div></div>';document.querySelector('main').append(comparison);DarbSprites.paint(document.getElementById('case-after'),'icons',8);
const samples=document.createElement('section');samples.id='case-sizes';samples.innerHTML='<h2>الشنطة بأحجام مختلفة</h2><div class="sizes"></div>';for(const size of[24,32,48,88,160]){const frame=document.createElement('span');frame.style.width=frame.style.height=size+'px';DarbSprites.paint(frame,'icons',8);samples.querySelector('.sizes').append(frame);}document.querySelector('main').append(samples);
</script></html>
